name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Regenerate platform scaffolding
        run: |
          rm -rf android/ ios/ linux/ windows/ web/ macos/
          flutter create --project-name money_tracker --org com.example .
          git checkout -- lib/ pubspec.yaml analysis_options.yaml

      - name: Fix Android build config
        run: |
          # Kotlin 2.0.0 — required by shared_preferences_android >=2.4
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.0.0"/' android/settings.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '2.0.0'/" android/build.gradle
          # compileSdk 35 — required by sqlite3_flutter_libs
          sed -i 's/compileSdk[= ].*/compileSdk = 35/' android/app/build.gradle
          # minSdk 23 — required by firebase-auth 23.x
          sed -i 's/minSdk[= ].*/minSdk = 23/' android/app/build.gradle

      - name: Create placeholder google-services.json
        run: |
          cat > android/app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "firebase_url": "https://placeholder.firebaseio.com",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.example.money_tracker" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyPlaceholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Regenerate platform scaffolding
        run: |
          rm -rf macos/
          flutter create --project-name money_tracker --org com.example --platforms macos .
          git checkout -- lib/ pubspec.yaml analysis_options.yaml

      - name: Fix macOS deployment target
        run: |
          sed -i '' 's/platform :osx.*/platform :osx, '\''10.15'\''/' macos/Podfile
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = .*/MACOSX_DEPLOYMENT_TARGET = 10.15;/' macos/Runner.xcodeproj/project.pbxproj

      - name: Create placeholder GoogleService-Info.plist
        run: |
          cat > macos/Runner/GoogleService-Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>placeholder</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.example.moneyTracker</string>
            <key>PROJECT_ID</key><string>placeholder</string>
            <key>STORAGE_BUCKET</key><string>placeholder.appspot.com</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><true/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:macos:0000000000000000</string>
          </dict>
          </plist>
          PEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS app
        run: flutter build macos --release

      - name: Create DMG
        run: |
          APP_NAME=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_NAME" ]; then
            echo "No .app found!" && exit 1
          fi
          cd build/macos/Build/Products/Release
          mkdir -p dmg_content
          cp -R "$(basename "$APP_NAME")" dmg_content/
          hdiutil create -volname "MoneyTracker" -srcfolder dmg_content -ov -format UDZO MoneyTracker-macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/Build/Products/Release/MoneyTracker-macOS.dmg

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos

      - name: Rename artifacts
        run: |
          mv artifacts/android/app-release.apk artifacts/MoneyTracker-${{ github.ref_name }}-android.apk
          mv artifacts/macos/MoneyTracker-macOS.dmg artifacts/MoneyTracker-${{ github.ref_name }}-macOS.dmg 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: MoneyTracker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/MoneyTracker-${{ github.ref_name }}-android.apk
            artifacts/MoneyTracker-${{ github.ref_name }}-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
