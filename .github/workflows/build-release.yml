name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Regenerate platform scaffolding
        run: |
          rm -rf android/ ios/ linux/ windows/ web/ macos/
          flutter create --project-name money_tracker --org com.example .
          git checkout -- lib/ pubspec.yaml analysis_options.yaml

      - name: Fix compileSdk for sqlite3_flutter_libs
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts 2>/dev/null || sed -i 's/compileSdk.*/compileSdk = 35/' android/app/build.gradle 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Regenerate platform scaffolding
        run: |
          rm -rf macos/
          flutter create --project-name money_tracker --org com.example --platforms macos .
          git checkout -- lib/ pubspec.yaml analysis_options.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS app
        run: flutter build macos --release

      - name: Create DMG
        run: |
          APP_NAME=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_NAME" ]; then
            echo "No .app found!" && exit 1
          fi
          cd build/macos/Build/Products/Release
          mkdir -p dmg_content
          cp -R "$(basename "$APP_NAME")" dmg_content/
          hdiutil create -volname "MoneyTracker" -srcfolder dmg_content -ov -format UDZO MoneyTracker-macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/Build/Products/Release/MoneyTracker-macOS.dmg

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos

      - name: Rename artifacts
        run: |
          mv artifacts/android/app-release.apk artifacts/MoneyTracker-${{ github.ref_name }}-android.apk
          mv artifacts/macos/MoneyTracker-macOS.dmg artifacts/MoneyTracker-${{ github.ref_name }}-macOS.dmg 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: MoneyTracker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/MoneyTracker-${{ github.ref_name }}-android.apk
            artifacts/MoneyTracker-${{ github.ref_name }}-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
