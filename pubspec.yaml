name: money_tracker
description: Cross-platform expense & subscription tracker with T-Bank integration and scope-based budgeting
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Database (local, offline-first)
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.1

  # Charts
  fl_chart: ^0.68.0

  # HTTP & Networking
  http: ^1.2.1
  dio: ^5.4.3+1

  # Notifications
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4

  # UI & Formatting
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.2.6

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Utils
  collection: ^1.18.0
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
